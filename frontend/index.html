<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="theme-color"
      content="#f8fafc"
    />
    <meta
      name="description"
      content="ORBS — Office Resource Booking System"
    />
    <title>ORBS · Office Resource Booking System</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("orbs-theme");
          var isDark = theme === "dark";
          document.documentElement.dataset.theme = isDark ? "dark" : "light";
          document.documentElement.style.backgroundColor = isDark ? "#0e1522" : "#f7f9fc";
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
